---
# Common Role – applied to all servers
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install common packages
  apt:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - net-tools
      - unzip
      - python3
      - python3-pip
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
    state: present

- name: Set timezone to UTC
  timezone:
    name: UTC

- name: Configure sysctl for performance
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { key: "net.core.somaxconn",          value: "65535" }
    - { key: "net.ipv4.tcp_max_syn_backlog", value: "65535" }
    - { key: "fs.file-max",                  value: "100000" }

- name: Create /opt/lab3 directory
  file:
    path: /opt/lab3
    state: directory
    mode: '0755'

- name: Install Python packages
  pip:
    name:
      - requests
      - boto3
      - docker
    state: present
