---
# ELK Stack Playbook – Installs Elasticsearch, Logstash, and Kibana
- name: Deploy ELK Stack
  hosts: elk_servers
  become: true
  vars:
    elk_version: "8.13.0"
    elasticsearch_port: 9200
    kibana_port: 5601
    logstash_port: 5044
    es_heap_size: "1g"

  tasks:
    - name: Install Java (required for Elasticsearch/Logstash)
      apt:
        name: openjdk-17-jdk
        state: present
        update_cache: yes

    - name: Install Docker and docker-compose
      apt:
        name:
          - docker.io
          - docker-compose
        state: present

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: true

    - name: Set vm.max_map_count for Elasticsearch
      sysctl:
        name: vm.max_map_count
        value: '262144'
        state: present
        reload: yes

    - name: Create ELK directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/elk
        - /opt/elk/elasticsearch
        - /opt/elk/logstash
        - /opt/elk/kibana
        - /opt/elk/data/elasticsearch
        - /opt/elk/data/logstash

    - name: Copy Elasticsearch config
      copy:
        src: "{{ playbook_dir }}/../../elk/elasticsearch/elasticsearch.yml"
        dest: /opt/elk/elasticsearch/elasticsearch.yml
        mode: '0644'

    - name: Copy Logstash pipeline config
      copy:
        src: "{{ playbook_dir }}/../../elk/logstash/logstash.conf"
        dest: /opt/elk/logstash/logstash.conf
        mode: '0644'

    - name: Copy Kibana config
      copy:
        src: "{{ playbook_dir }}/../../elk/kibana/kibana.yml"
        dest: /opt/elk/kibana/kibana.yml
        mode: '0644'

    - name: Deploy ELK docker-compose
      copy:
        src: "{{ playbook_dir }}/../../elk/docker-compose.yml"
        dest: /opt/elk/docker-compose.yml
        mode: '0644'

    - name: Start ELK stack
      community.docker.docker_compose:
        project_src: /opt/elk
        state: present
        pull: yes

    - name: Wait for Elasticsearch to be ready
      uri:
        url: "http://localhost:{{ elasticsearch_port }}/_cluster/health"
        status_code: 200
      register: es_health
      until: es_health.status == 200
      retries: 15
      delay: 10

    - name: Wait for Kibana to be ready
      uri:
        url: "http://localhost:{{ kibana_port }}/api/status"
        status_code: 200
      register: kibana_health
      until: kibana_health.status == 200
      retries: 15
      delay: 10

    - name: Print ELK endpoints
      debug:
        msg:
          - "Elasticsearch: http://{{ ansible_host }}:{{ elasticsearch_port }}"
          - "Kibana:        http://{{ ansible_host }}:{{ kibana_port }}"
          - "Logstash:      {{ ansible_host }}:{{ logstash_port }} (Beats input)"
