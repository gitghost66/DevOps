global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s
  external_labels:
    monitor: 'lab3-prometheus'
    environment: 'lab'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter – host system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'
          - '192.168.1.20:9100'  # app01
          - '192.168.1.21:9100'  # app02
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: instance

  # cAdvisor – container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets:
          - 'cadvisor:8080'

  # Application metrics
  - job_name: 'lab3-app'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - '192.168.1.20:8080'
          - '192.168.1.21:8080'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Elasticsearch Exporter
  - job_name: 'elasticsearch'
    static_configs:
      - targets:
          - '192.168.1.11:9114'

  # Alertmanager
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
