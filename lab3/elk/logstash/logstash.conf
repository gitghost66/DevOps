# Logstash Pipeline Configuration
# Accepts logs from Filebeat and syslog, enriches, and ships to Elasticsearch

input {
  # Filebeat input (from containers)
  beats {
    port => 5044
    type => "beats"
  }

  # Syslog input
  syslog {
    port => 5000
    type => "syslog"
  }

  # Direct TCP input (for custom apps)
  tcp {
    port => 5001
    codec => json_lines
    type => "app-json"
  }
}

filter {
  # Parse Nginx/Apache access logs
  if [type] == "nginx" or [fields][log_type] == "nginx" {
    grok {
      match => {
        "message" => '%{IPORHOST:client_ip} - %{DATA:user} \[%{HTTPDATE:timestamp}\] "%{WORD:method} %{DATA:uri} HTTP/%{NUMBER:http_version}" %{NUMBER:status} %{NUMBER:bytes} "%{DATA:referrer}" "%{DATA:user_agent}"'
      }
    }
    mutate {
      convert => { "status" => "integer" "bytes" => "integer" }
    }
    date {
      match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
    }
  }

  # Parse application JSON logs
  if [type] == "app-json" {
    json {
      source => "message"
    }
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Add GeoIP data based on client IP
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }

  # Drop health check logs
  if [uri] =~ /^\/health/ or [uri] =~ /^\/metrics/ {
    drop {}
  }

  # Add environment tag
  mutate {
    add_field => {
      "environment" => "lab3"
      "[@metadata][index_prefix]" => "logstash"
    }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["${ELASTICSEARCH_URL}"]
    index => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
    action => "index"
  }

  # Debug output (disable in production)
  stdout {
    codec => rubydebug {
      metadata => false
    }
  }
}
