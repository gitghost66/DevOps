# ─── Blue Deployment — Blue-Green Strategy (ACTIVE/LIVE slot) ─────────────────
# The "blue" environment runs the current stable version (v1.0.0).
# The Service selector points to "blue" while green is being prepared.
#
# Apply: kubectl apply -f k8s/blue-green/blue-deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab2-app-blue
  namespace: default
  labels:
    app: lab2-app
    slot: blue
    version: "1.0.0"
    lab: "lab2"
spec:
  replicas: 3

  selector:
    matchLabels:
      app: lab2-app
      slot: blue

  template:
    metadata:
      labels:
        app: lab2-app
        slot: blue
        version: "1.0.0"
    spec:
      containers:
        - name: lab2-app
          image: devops-lab2-app:1.0.0
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: APP_NAME
              value: "devops-lab2-app"
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: PORT
              value: "3000"

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
