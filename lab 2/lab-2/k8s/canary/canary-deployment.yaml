# ─── Canary Deployment — Canary Strategy (10% traffic) ───────────────────────
# 1 replica of v2.0.0 alongside 9 stable replicas.
# Both share the same Service selector (app: lab2-app), so the load balancer
# distributes ~10% of requests to this canary pod.
#
# Apply: kubectl apply -f k8s/canary/canary-deployment.yaml
#
# Monitor canary health:
#   kubectl logs -l track=canary --tail=50 -f
#
# If canary is healthy → scale up canary and scale down stable:
#   kubectl scale deployment lab2-app-canary  --replicas=9
#   kubectl scale deployment lab2-app-stable  --replicas=1
#
# If canary fails → remove it instantly:
#   kubectl delete deployment lab2-app-canary

apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab2-app-canary
  namespace: default
  labels:
    app: lab2-app
    track: canary
    version: "2.0.0"
    lab: "lab2"
spec:
  replicas: 1   # 1 out of 10 total replicas → ~10% of traffic

  selector:
    matchLabels:
      app: lab2-app
      track: canary

  template:
    metadata:
      labels:
        app: lab2-app
        track: canary
        version: "2.0.0"
    spec:
      containers:
        - name: lab2-app
          image: devops-lab2-app:2.0.0
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          env:
            - name: APP_VERSION
              value: "2.0.0"
            - name: APP_NAME
              value: "devops-lab2-app"
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: PORT
              value: "3000"

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
