# ─── Service — Lab 2 App NodePort ─────────────────────────────────────────────
# Exposes the Deployment externally via Minikube NodePort.
# Access URL: minikube service lab2-app-service --url
# Apply: kubectl apply -f k8s/service.yaml

apiVersion: v1
kind: Service
metadata:
  name: lab2-app-service
  namespace: default
  labels:
    app: lab2-app
    lab: "lab2"
spec:
  type: NodePort
  selector:
    app: lab2-app
  ports:
    - name: http
      protocol: TCP
      port: 80          # Service port (cluster-internal)
      targetPort: 3000  # Container port
      nodePort: 30080   # External port on the Minikube node
